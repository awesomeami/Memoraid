<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%232563eb%22/><path d=%22M50 25v50M25 50h50%22 stroke=%22white%22 stroke-width=%2212%22 stroke-linecap=%22round%22/></svg>" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Memoraid — AI Medical Mnemonic Generator" />
    <meta property="og:description" content="Supercharge your clinical retention. Generate and save custom mnemonics, study decks, and visual memorization metaphors." />

    <!-- Google Fonts Preconnect and Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <script>
      (function() {
        const stored = localStorage.getItem('medmnemonic_theme');
        if (stored === 'dark' || !stored) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
